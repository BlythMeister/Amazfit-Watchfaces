name: Sync docs preview images

on:
  push:
    branches:
      - '**'
    paths:
      - 'src/**/Preview.gif'
      - '.github/workflows/sync-docs-preview-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-preview-images:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync preview gifs into docs/images
        run: |
          set -euo pipefail

          mkdir -p docs/images

          mapfile -t preview_files < <(find src -mindepth 2 -maxdepth 2 -type f -name 'Preview.gif' | sort)

          for preview_path in "${preview_files[@]}"; do
            folder_name="$(basename "$(dirname "$preview_path")")"
            cp "$preview_path" "docs/images/${folder_name}.gif"
          done

          while IFS= read -r existing_gif; do
            gif_name="$(basename "$existing_gif")"
            source_folder="${gif_name%.gif}"

            if [[ ! -f "src/${source_folder}/Preview.gif" ]]; then
              rm "$existing_gif"
            fi
          done < <(find docs/images -maxdepth 1 -type f -name '*.gif' | sort)

      - name: Commit updated docs images
        run: |
          set -euo pipefail

          if git diff --quiet -- docs/images; then
            echo 'No docs image changes to commit.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/images
          git commit -m 'chore(docs): sync preview gifs into docs images'
          git push
